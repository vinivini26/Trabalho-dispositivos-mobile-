name: RotaFit - Testes e APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rotafit/**'
      - '.github/workflows/rotafit-android.yml'

permissions:
  contents: read

concurrency:
  group: rotafit-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rotafit
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rotafit/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar ferramentas Android
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos e testar app e banco
        run: |
          npm run typecheck
          npm test
      - name: Gerar projeto nativo
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK de demonstração
        run: |
          android/gradlew -p android assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs='-Xmx3072m -XX:MaxMetaspaceSize=1024m'
          mkdir -p entrega
          cp android/app/build/outputs/apk/release/app-release.apk entrega/RotaFit-homologacao-arm64.apk
          sha256sum entrega/RotaFit-homologacao-arm64.apk > entrega/SHA256SUMS.txt
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaFit-homologacao-arm64
          path: rotafit/entrega/
          if-no-files-found: error
          retention-days: 14
